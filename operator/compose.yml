name: govhub-shutter-dao-0x36

x-database-url: &database-url postgres://concorde:concorde@postgres:5432/concorde

services:
  gateway:
    build:
      context: ..
      dockerfile: operator/Dockerfile
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?copy .env.example to .env and put your model key in it}
      DATABASE_URL: *database-url
      DELEGATES: ${DELEGATES:?copy .env.example to .env}
      SIGNING_KEY_FILE: /app/signing-key.pem
      SNAPSHOT_SPACE: ${SNAPSHOT_SPACE:-shutterdao0x36.eth}
      DIGEST_CRON: ${DIGEST_CRON:-0 9 * * *}
      SHUTTER_API_BASE: ${SHUTTER_API_BASE:-https://shutter-api.shutter.network/api}
      PUBLIC_HOST: 0.0.0.0
      PUBLIC_PORT: "8082"
      AGENT_HOST: 0.0.0.0
      AGENT_PORT: "7411"
      AGENT_SERVER_URL: http://gateway:7411
      AGENT_IMAGE: govhub-0x36-agent:0.83.0
      AGENT_NETWORK: govhub_0x36_agent
      RUNTIME_DIR_HOST: ${PWD}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SIGNING_KEY_FILE:?}:/app/signing-key.pem:ro
      - ./state/workspace:/app/state/workspace
      - ./state/agent:/app/state/agent
    ports:
      - "127.0.0.1:8082:8082"
    networks: [db, agent, public]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      agent-image:
        condition: service_completed_successfully
    stop_grace_period: 300s

  migrate:
    build:
      context: ..
      dockerfile: operator/Dockerfile
    command: ["npx", "drizzle-kit", "push", "--force"]
    environment:
      DATABASE_URL: *database-url
    restart: "no"
    networks: [db]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: concorde
      POSTGRES_PASSWORD: concorde
      POSTGRES_DB: concorde
    volumes:
      - db:/var/lib/postgresql/data
    networks: [db]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "concorde", "-d", "concorde"]
      interval: 3s
      timeout: 3s
      retries: 20

  agent-image:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: govhub-0x36-agent:0.83.0
    command: ["--version"]
    restart: "no"
    networks: [agent]

networks:
  db:
    name: govhub_0x36_db
  agent:
    name: govhub_0x36_agent
  public:
    name: govhub_0x36_public

volumes:
  db:
